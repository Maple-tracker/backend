spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000
        dialect: org.hibernate.dialect.MySQLDialect

  datasource:
    url: jdbc:mysql://${RDS_DB_ENDPOINT}/${MYSQL_DATABASE_DEV}?useSSL=false&allowPublicKeyRetrieval=true
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  data-loader:
    activate: ${DATA_LOADER_ACTIVATE} # .env 파일에서 true-false 지정
